# JARVIS dev_graph stack — offline-first.
#
#   neo4j     : Neo4j 5 + APOC, the graph store (populated by ../sync_to_neo4j.py)
#   api       : read-only FastAPI traversal service over the graph
#   frontend  : static graph-explorer UI (nginx serving ./frontend)
#
# Quick start (offline):
#   1. docker compose up -d neo4j           # start the DB
#   2. (host) populate it once:  NEO4J_PASSWORD=elnino_dev python ../sync_to_neo4j.py
#   3. docker compose up -d api frontend     # API + UI
#   4. open http://localhost:8080
#
# To move to Neo4j Aura later: stop the neo4j service, set NEO4J_URI=neo4j+s://<id>.databases.neo4j.io
# and the Aura credentials in .env, and re-run `python ../sync_to_neo4j.py` against Aura. Nothing
# in the api or frontend changes.

services:
  neo4j:
    image: neo4j:5-community
    container_name: elnino-neo4j
    restart: unless-stopped
    ports:
      # Host ports remapped off the defaults (7474/7687) so this stack can run alongside the
      # Knowledge-Graph-App's kg-dev-neo4j-1 container, which already holds 7474/7687 on the host.
      # The container still listens on 7474/7687 internally, so the in-compose api service below
      # (bolt://neo4j:7687) is unaffected — only the host-published ports change.
      - "7475:7474"   # Neo4j Browser (http://localhost:7475)
      - "7688:7687"   # Bolt (host) -> 7687 (container)
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-elnino_dev}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      # Bolt still LISTENS on 7687 inside the container (so the in-compose api's direct
      # bolt://neo4j:7687 is unchanged), but the server ADVERTISES 7688 — the host-published
      # port. The Neo4j Browser connects via the neo4j:// routing scheme and uses the advertised
      # address, so without this it would route to host 7687 (the other kg-dev-neo4j-1 container).
      # Direct bolt:// clients (sync script, MCP, api) ignore the advertised address.
      NEO4J_server_bolt_advertised__address: "localhost:7688"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    container_name: elnino-graph-api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-elnino_dev}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: elnino-graph-ui
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  # Pre-existing volumes created outside compose; declared external so `docker compose up`
  # adopts the populated graph instead of creating a fresh empty DB.
  neo4j_data:
    external: true
    name: elnino_neo4j_data
  neo4j_logs:
    external: true
    name: elnino_neo4j_logs
