[project]
name = "layer3-trading-engine"
version = "0.1.0"
description = "Autonomous trading engine — Layer 3 (execution). First slice: Risk Control Guardrail Engine (MOD-001)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk", "src/supervisor", "src/snapshot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
